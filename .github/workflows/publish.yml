name: Build and Publish Resume

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Tectonic LaTeX engine
        run: |
          curl -sSL "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-musl.tar.gz" | tar -xz
          sudo mv tectonic /usr/local/bin/
          tectonic --version

      - name: Build PDF from LaTeX
        run: |
          mkdir -p generated
          tectonic -o generated aviral-gupta-resume.tex

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aviral-gupta-resume
          path: generated/aviral-gupta-resume.pdf
          if-no-files-found: error

      - name: Prepare GitHub Pages bundle
        run: |
          mkdir -p _site
          cp aviral-gupta-resume.html _site/index.html
          cp generated/aviral-gupta-resume.pdf _site/aviral-gupta-resume.pdf

      - name: Upload Pages Artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish to GitHub Release (on push to main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Resume"
          body: "Automated build of Aviral Gupta's resume PDF from latest push to `main`."
          files: generated/aviral-gupta-resume.pdf
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
